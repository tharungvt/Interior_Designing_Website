<!doctype html>
<html class="scroll-smooth" lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interior Design Studio</title>
    <meta name="description" content="A modern interior design studio website showcasing residential and commercial interior design services, project portfolios, and consultations." />
    <meta property="og:title" content="Interior Design Studio" />
    <meta property="og:description" content="A modern interior design studio website showcasing residential and commercial interior design services, project portfolios, and consultations." />
    
    <!-- Tailwind CSS v3 with Forms & Container Queries -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    
    <!-- Google Fonts: EB Garamond, Newsreader & Plus Jakarta Sans / Inter -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                surface: '#F1F5F4',
                subsurface: '#EEF4F3',
                stone: '#E5EEEC',
                warmstone: '#E4ECEB',
                mineral: '#3C7188',
                mineraldark: '#17252C',
                charcoal: '#17252C',
                mutedcharcoal: '#4A5F68',
                slate: '#5F747D',
                border: '#DCE5E7',
                borderlight: '#D7E3E5'
              }
            },
            fontFamily: {
              editorial: ['EB Garamond', 'Newsreader', 'Georgia', 'serif'],
              sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
              mono: ['SFMono-Regular', 'Menlo', 'Monaco', 'monospace']
            },
            boxShadow: {
              'atelier-subtle': '0 4px 20px -4px rgba(23, 37, 44, 0.04)',
              'card-warm': '0 16px 36px -12px rgba(23, 37, 44, 0.06)',
              'glow-atelier': '0 8px 24px -6px rgba(60, 113, 136, 0.22)'
            }
          }
        }
      }
    </script>
  </head>
  <body class="overflow-x-hidden antialiased selection:bg-brand-mineral selection:text-white bg-[#F1F5F4]">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
